name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[recognition,dev]"
      - run: python -m pytest
      - run: python scripts/run_teacher_agent_multiturn_benchmark.py --validate-only
      - run: python -m compileall -q teaching_skill_miner scripts
      - run: sh -n scripts/*.sh
      - run: python -m ruff check teaching_skill_miner tests scripts

  package-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[recognition,dev]"
      - run: python scripts/audit_repository_privacy.py
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: sh scripts/build_release_acceptance.sh
      - uses: actions/upload-artifact@v4
        with:
          name: teaching-skill-miner-release-candidate
          path: |
            dist/*.whl
            artifacts/release_acceptance_*.json
          if-no-files-found: error
