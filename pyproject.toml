[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teaching-skill-miner"
version = "1.2.0"
description = "Teaching video method distillation, executable skill generation, and evaluation"
readme = "README.md"
authors = [{name = "Teaching Skill Miner contributors"}]
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42,<47",
]
license = "LicenseRef-Academic-Evaluation-1.0"
license-files = ["LICENSE"]
keywords = ["education", "teaching-skill", "multimodal", "video", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
]

[project.optional-dependencies]
recognition = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
]
visual = [
  "huggingface-hub>=0.24,<2",
  "Pillow>=10,<13",
  "safetensors>=0.4,<1",
  "torch>=2.2,<3",
  "transformers>=4.46,<6",
]
browser-test = [
  "Pillow>=10,<13",
  "playwright>=1.50,<2",
]
asr-gpu = [
  "ctranslate2>=4.4,<5",
  "faster-whisper>=1.1,<2",
]
dev = [
  "build>=1.2",
  "jsonschema>=4.20",
  "Pillow>=10,<13",
  "pytest>=8",
  "ruff==0.15.22",
  "setuptools==80.9.0",
]

[project.scripts]
tsm = "teaching_skill_miner.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["teaching_skill_miner*"]
exclude = ["teaching_skill_miner.__pycache__*"]
namespaces = false

[tool.setuptools.package-data]
"teaching_skill_miner.web" = [
  "index.html",
  "private_demo.html",
  "private_skill_demo.css",
  "private_skill_demo.js",
  "teacher_agent_demo.html",
  "teacher_agent_demo.css",
  "teacher_agent_demo.js",
  "assets/student-xiaoyu.png",
  "assets/student-zimo.png",
  "assets/student-zhixing.png",
]

[tool.setuptools.data-files]
"share/teaching-skill-miner/data" = [
  "data/dataset_manifest.json",
  "data/evaluation_cases.json",
  "data/formal_caption_sources.json",
  "data/neural_v1_runtime_manifest.json",
