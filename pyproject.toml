[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "2.0.0"
description = "Auditable, provider-neutral coding-agent harness with CLI and TUI"
readme = "README.md"
authors = [{name = "Agent Harness contributors"}]
requires-python = ">=3.10"
dependencies = []
license = "LicenseRef-Academic-Evaluation-1.0"
license-files = ["LICENSE"]
keywords = ["agent", "harness", "coding-agent", "tui", "tool-use"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff==0.15.22",
  "setuptools==80.9.0",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
harness = "agent_harness.cli:main"
harness-tui = "agent_harness.tui:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["agent_harness*"]
exclude = ["agent_harness.__pycache__*"]
namespaces = false

[tool.setuptools.data-files]
"share/agent-harness/schema" = [
  "schema/agent_harness_checkpoint.schema.json",
  "schema/agent_harness_event.schema.json",
  "schema/agent_harness_trace.schema.json",
  "schema/harness_journal_checkpoint.schema.json",
  "schema/harness_journal_record.schema.json",
]
"share/agent-harness/governance" = [
  "CHANGELOG.md",
  "PRIVACY.md",
  "SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests_harness"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
